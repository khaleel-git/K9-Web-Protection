<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <script>window.APP_PLATFORM='win'</script>
  <!-- Pre-paint: stored choice, else OS language, else English; mirrors src/i18n/index.js. -->
  <script>try{var l=null;try{l=localStorage.getItem('k10.lang')}catch(e){}if(l!=='en'&&l!=='he'){var d=String(navigator.language||'').toLowerCase().split('-')[0];l=(d==='he'||d==='iw')?'he':'en'}document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr'}catch(e){}</script>
  <title data-i18n="nav.header.title"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    #wailsDragBar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--titlebar); z-index: 9999;
      --wails-draggable: drag;
      background: var(--navy-dark);
    }
  </style>
</head>
<body>

<div id="wailsDragBar"></div>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<header class="k9-header">
  <div class="k9-logo-area">
    <img class="k9-logo" src="/logo.webp" alt="K10" />
    <div class="k9-title-wrap">
      <div class="k9-title" data-i18n="nav.header.title"></div>
    </div>
  </div>
  <div class="header-right">
    <span id="k9StatusDot" class="status-badge" data-i18n="nav.status.inactive"></span>
    <button class="k9-logout-btn" onclick="showDisableModal()" data-i18n-title="nav.logout.title">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
      <span data-i18n="nav.logout"></span>
    </button>
    <button class="k9-logout-btn" onclick="showQuitModal()" data-i18n-title="nav.exit.title">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span data-i18n="nav.exit"></span>
    </button>
  </div>
</header>

<!-- ── TAB NAVIGATION ──────────────────────────────────────────────────────── -->
<nav id="mainMenu" class="k9-tabs">
  <ul>
    <li id="tab-home" class="selected">
      <a href="#" class="k9-tab navLink" data-tab="home">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        <span data-i18n="nav.tab.home"></span>
      </a>
    </li>
    <li id="tab-reports">
      <a href="#" class="k9-tab navLink" data-tab="reports">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        <span data-i18n="nav.tab.reports"></span>
      </a>
    </li>
    <li id="tab-setup">
      <a href="#" class="k9-tab navLink" data-tab="setup">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span data-i18n="nav.tab.setup"></span>
      </a>
    </li>
    <li id="tab-focusmode">
      <a href="#" class="k9-tab navLink" data-tab="focusmode">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span data-i18n="nav.tab.focusmode"></span>
      </a>
    </li>
    <li id="tab-help">
      <a href="#" class="k9-tab navLink" data-tab="help">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="nav.tab.help"></span>
      </a>
    </li>
  </ul>
</nav>

<!-- ── BODY: SIDEBAR + CONTENT ────────────────────────────────────────────── -->
<div class="k9-body">

  <!-- SIDEBAR -->
  <nav id="subMenu" class="k9-sidebar" style="display:none">
    <div id="sidebar-setup" style="display:none">
      <div class="sidebar-hdr">
        <span class="sh-icon">
          <svg width="26" height="26" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <div class="sidebar-hdr-title" data-i18n="nav.sidebar.setup"></div>
      </div>
      <ul>
        <li id="item-categories">
          <a href="#" class="slink sideLink" data-page="categories">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
            <span data-i18n="nav.side.categories"></span>
          </a>
        </li>
        <li id="item-time">
          <a href="#" class="slink sideLink" data-page="time">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
            <span data-i18n="nav.side.time"></span>
          </a>
        </li>
        <li id="item-overrides">
          <a href="#" class="slink sideLink" data-page="exceptions">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span>
            <span data-i18n="nav.side.exceptions"></span>
          </a>
        </li>
        <li id="item-effects">
          <a href="#" class="slink sideLink" data-page="effects">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></span>
            <span data-i18n="nav.side.effects"></span>
          </a>
        </li>
        <li id="item-keywords">
          <a href="#" class="slink sideLink" data-page="keywords">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>
            <span data-i18n="nav.side.keywords"></span>
          </a>
        </li>
        <li id="item-search">
          <a href="#" class="slink sideLink" data-page="safesearch">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <span data-i18n="nav.side.safesearch"></span>
          </a>
        </li>
        <li id="item-advanced">
          <a href="#" class="slink sideLink" data-page="advanced">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
            <span data-i18n="nav.side.advanced"></span>
          </a>
        </li>
        <li id="item-pwemail">
          <a href="#" class="slink sideLink" data-page="password">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <span data-i18n="nav.side.password"></span>
          </a>
        </li>
        <li id="item-update">
          <a href="#" class="slink sideLink" data-page="update">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
            <span data-i18n="nav.side.update"></span>
          </a>
        </li>
      </ul>
    </div>
    <div id="sidebar-reports" style="display:none">
      <div class="sidebar-hdr">
        <span class="sh-icon">
          <svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        </span>
        <div class="sidebar-hdr-title" data-i18n="nav.sidebar.activity"></div>
      </div>
      <ul>
        <li id="item-summary">
          <a href="#" class="slink sideLink" data-page="reports">
            <span class="sl-icon"><svg viewBox="0 0 24 24" width="12" height="12"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg></span>
            <span data-i18n="nav.side.summary"></span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- CONTENT AREA -->
  <main class="k9-content">

    <!-- ── HOME ──────────────────────────────────────────────────────────── -->
    <div id="page-home">

      <div class="content-title">
        <span class="ct-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span>
        <span data-i18n="dash.title"></span>
      </div>

      <!-- Protection inactive warning — hidden when active -->
      <div id="protection-inactive-bar" class="inactive-bar" style="display:none">
        <span>&#x26A0;&nbsp;<strong data-i18n="dash.inactive.notice"></strong></span>
        <button class="k9-btn green" id="btn-enable" onclick="enableProtection()" data-i18n="dash.btn.enable"></button>
        <button class="k9-btn red" id="btn-disable" onclick="showDisableModal()" style="display:none" data-i18n="dash.btn.disable"></button>
      </div>
      <div id="settings-warning-bar" class="inactive-bar" style="display:none">
        <span>&#x26A0;&nbsp;<strong id="settings-warning-text" dir="auto"></strong></span>
        <button class="k9-btn" id="btn-retry-hosts" onclick="retryHosts()" style="display:none" data-i18n="dash.btn.retry-hosts"></button>
      </div>
      <!-- Hidden anchors so main.js can still toggle them -->
      <span id="btn-enable-hidden" style="display:none"></span>
      <span id="btn-disable-hidden" style="display:none"></span>

      <!-- Stat cards -->
      <div class="dash-grid">
        <div class="dash-card warn">
          <div class="dash-card-header">
            <span class="dash-card-title" data-i18n="dash.card.blocked-today"></span>
            <span class="dash-card-icon"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></span>
          </div>
          <div class="dash-card-value" id="stat-today">—</div>
          <div class="dash-card-sub" data-i18n="dash.card.blocked-today-sub"></div>
        </div>
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title" data-i18n="dash.card.total-blocked"></span>
            <span class="dash-card-icon"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
          </div>
          <div class="dash-card-value" id="stat-total">—</div>
          <div class="dash-card-sub" data-i18n="dash.card.total-blocked-sub"></div>
        </div>
        <div class="dash-card highlight">
          <div class="dash-card-header">
            <span class="dash-card-title" data-i18n="dash.card.filter-level"></span>
            <span class="dash-card-icon"><svg viewBox="0 0 24 24" width="14" height="14"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
          </div>
          <div class="dash-card-value" id="stat-filter-level">—</div>
          <div class="dash-card-sub" id="stat-filter-sub">—</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title" data-i18n="dash.card.exceptions"></span>
            <span class="dash-card-icon"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span>
          </div>
          <div class="dash-card-value" id="stat-exceptions" style="font-size:14px">—</div>
          <div class="dash-card-sub" data-i18n="dash.card.exceptions-sub"></div>
        </div>
      </div>

      <!-- Main split: left = modules + categories, right = database + recent activity -->
      <div class="dash-split">
        <div class="dash-col">
          <div class="dash-section-title" data-i18n="dash.section.modules"></div>
          <div class="prot-row">
            <div class="prot-dot" id="dot-web-protection"></div>
            <span class="prot-label" data-i18n="dash.module.web"></span>
            <span class="prot-val" id="mod-web-protection" data-i18n="dash.module.checking"></span>
          </div>
          <div class="prot-row">
            <div class="prot-dot" id="dot-malware"></div>
            <span class="prot-label" data-i18n="dash.module.malware"></span>
            <span class="prot-val" id="mod-malware" data-i18n="dash.module.checking"></span>
          </div>
          <div class="prot-row">
            <div class="prot-dot" id="dot-safesearch"></div>
            <span class="prot-label" data-i18n="dash.module.safesearch"></span>
            <span class="prot-val" id="mod-safesearch" data-i18n="dash.module.checking"></span>
          </div>
          <div class="prot-row">
            <div class="prot-dot" id="dot-https"></div>
            <span class="prot-label" data-i18n="dash.module.https"></span>
            <span class="prot-val" id="mod-https" data-i18n="dash.module.checking"></span>
          </div>
          <div class="prot-row">
            <div class="prot-dot" id="dot-dns"></div>
            <span class="prot-label" data-i18n="dash.module.dns"></span>
            <span class="prot-val" id="mod-dns" data-i18n="dash.module.checking"></span>
          </div>

          <div class="dash-section-title" style="margin-top:8px" data-i18n="dash.section.top-categories"></div>
          <div id="top-categories-bars">
            <div class="dash-bar-row"><span class="dash-bar-label">—</span><div class="dash-bar-track"></div><span class="dash-bar-val">—</span></div>
          </div>
        </div>

        <div class="dash-col">
          <div class="dash-section-title" data-i18n="dash.section.database"></div>
          <div class="dash-db">
            <div class="dash-db-chip">
              <div class="dash-db-num" id="db-domains">—</div>
              <div class="dash-db-label" data-i18n="dash.db.domains"></div>
            </div>
            <div class="dash-db-chip">
              <div class="dash-db-num" id="db-urls">—</div>
              <div class="dash-db-label" data-i18n="dash.db.urls"></div>
            </div>
            <div class="dash-db-chip">
              <div class="dash-db-num" id="db-keywords">—</div>
              <div class="dash-db-label" data-i18n="dash.db.keywords"></div>
            </div>
          </div>

          <div class="dash-section-title" style="margin-top:8px;display:flex;align-items:center;justify-content:space-between">
            <span data-i18n="dash.section.recent"></span>
            <button onclick="clearBlockedLog()" data-i18n-title="dash.clear.title" style="background:none;border:none;cursor:pointer;padding:2px 4px;color:#144985;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              <span data-i18n="dash.clear"></span>
            </button>
          </div>
          <div id="recent-activity">
            <div class="dash-recent-row">
              <span class="dash-recent-time muted">—</span>
              <span class="dash-recent-url muted" data-i18n="activity.empty.no-recent"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick actions row -->
      <div class="dash-quick-actions">
        <a href="#" class="dash-action-btn navLink" data-tab="reports">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
          <span data-i18n="dash.action.view-activity"></span>
        </a>
        <a href="#" class="dash-action-btn navLink" data-tab="setup">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span data-i18n="dash.action.setup-filters"></span>
        </a>
        <a href="#" class="dash-action-btn" onclick="verifyProtection(); return false;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n="dash.action.verify"></span>
        </a>
      </div>

      <!-- stat-db kept for compat -->
      <span id="stat-db" style="display:none"></span>
      <span id="stat-db-short" style="display:none"></span>
      <!-- layer status kept for compat with main.js -->
      <span id="status-layer1" style="display:none"></span>
      <span id="status-layer2" style="display:none"></span>
      <span id="dot-layer1" style="display:none"></span>
      <span id="dot-layer2" style="display:none"></span>

    </div><!-- /page-home -->

    <!-- ── VIEW INTERNET ACTIVITY ──────────────────────────────────────────── -->
    <div id="page-reports" style="display:none">

      <div class="content-title">
        <span class="ct-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg></span>
        <span data-i18n="reports.title"></span>
      </div>
      <span class="view-help" data-i18n="reports.help"></span>

      <div class="act-wrap">
        <div class="act-col">
          <div class="act-col-head"><span data-i18n="reports.col.domain"></span><span data-i18n="reports.col.hits"></span></div>
          <div id="activity-rows">
            <div class="act-row"><span class="muted" data-i18n="activity.empty.none-recorded"></span></div>
          </div>
        </div>
        <div class="act-col" style="max-width:220px">
          <div class="act-col-head"><span data-i18n="reports.col.general"></span><span data-i18n="reports.col.count"></span></div>
          <div class="act-row"><span data-i18n="reports.total-blocked"></span><span class="num" id="gen-total">0</span></div>
          <div class="act-row"><span data-i18n="reports.blocked-today"></span><span class="num" id="gen-today">0</span></div>
        </div>
      </div>

    </div><!-- /page-reports -->

    <!-- ── WEB CATEGORIES ──────────────────────────────────────────────────── -->
    <div id="page-categories" style="display:none">

      <div class="content-title">

          <select id="adv-autostart" class="k9-select">
            <option value="true" data-i18n="common.yes"></option>
            <option value="false" data-i18n="common.no"></option>
          </select>
        </div>
        <div class="adv-row">
          <label data-i18n="advanced.logging"></label>
          <select class="k9-select" id="adv-logging">
            <option data-i18n="advanced.logging.basic"></option>
            <option data-i18n="advanced.logging.none"></option>
            <option data-i18n="advanced.logging.full"></option>
          </select>
        </div>
        <div class="adv-row">
          <label data-i18n="advanced.realtime"></label>
          <select class="k9-select">
            <option data-i18n="common.enabled"></option>
            <option data-i18n="common.disabled"></option>
          </select>
        </div>
        <div class="adv-row">
          <label data-i18n="advanced.override"></label>
          <select class="k9-select">
            <option data-i18n="common.no"></option>
            <option data-i18n="common.yes"></option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button class="k9-btn" onclick="loadAdvanced()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span data-i18n="common.cancel"></span>
        </button>
        <button class="k9-btn green" onclick="saveAdvanced()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span data-i18n="common.save"></span>
        </button>
      </div>

      <div style="margin-top:18px;padding:12px 14px;background:#f0f4fa;border:1px solid #b0bdd0;max-width:420px">
        <div style="font-size:11px;font-weight:800;color:#144985;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px" data-i18n="advanced.ca.title"></div>
        <div style="font-size:11px;color:#444;line-height:1.6;margin-bottom:10px" data-i18n="advanced.ca.desc"></div>
        <button class="k9-btn" id="btn-install-ca" onclick="installCA()" style="font-size:11px">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
          <span data-i18n="advanced.ca.button"></span>
        </button>
        <span id="ca-status" style="font-size:10px;color:#555;margin-inline-start:8px"></span>
      </div>

    </div><!-- /page-advanced -->

    <!-- ── K10 UPDATE ──────────────────────────────────────────────────────────── -->
    <div id="page-update" style="display:none">

      <div class="content-title">
        <span class="ct-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
        <span data-i18n="settings.update.title"></span>
      </div>

      <div class="upd-section">
        <div class="dash-section-title" style="margin-bottom:6px" data-i18n="settings.update.current-version"></div>
        <table class="k9-tbl" style="max-width:420px">
          <tbody>
            <tr><td class="lbl" data-i18n="settings.update.app-version"></td><td id="upd-app-ver" class="ltr-text"><strong>4.1.0</strong></td></tr>
            <tr><td class="lbl" data-i18n="settings.update.database"></td><td id="upd-db-size" data-i18n="common.loading"></td></tr>
            <tr><td class="lbl" data-i18n="settings.update.last-updated"></td><td id="upd-date" class="ltr-text">2026-06-01</td></tr>
          </tbody>
        </table>
      </div>

      <div class="upd-section" style="margin-top:10px">
        <div class="dash-section-title" style="margin-bottom:6px" data-i18n="settings.update.check-title"></div>
        <p style="font-size:11px;color:#555;margin-bottom:6px" data-i18n="settings.update.check-desc"></p>
        <button class="k9-btn green" onclick="checkForUpdate()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span data-i18n="settings.update.check-now"></span>
        </button>
      </div>

      <div class="upd-section" style="margin-top:10px">
        <div class="dash-section-title" style="margin-bottom:6px" data-i18n="settings.update.auto-title"></div>
        <label style="font-size:11px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="cb-auto-update" checked>
          <span data-i18n="settings.update.auto-label"></span>
        </label>
      </div>

      <div class="upd-section" style="margin-top:10px">
        <div class="dash-section-title" style="margin-bottom:6px" data-i18n="settings.diag.title"></div>
        <table class="k9-tbl" style="max-width:420px">
          <tbody id="diag-rows"></tbody>
        </table>
        <div id="diag-reload" style="display:none;margin-top:6px">
          <button class="k9-btn" id="btn-reload-settings" onclick="reloadSettings()" data-i18n="settings.diag.reload"></button>
        </div>
      </div>

      <div class="info-box" style="max-width:420px;margin-top:10px" data-i18n="settings.update.note"></div>

    </div><!-- /page-update -->

    <!-- ── PASSWORD & SETTINGS ──────────────────────────────────────────────── -->
    <div id="page-password" style="display:none">

      <div class="content-title">
        <span class="ct-icon"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span data-i18n="settings.password.title"></span>
      </div>
      <span class="view-help" data-i18n="settings.password.help"></span>

      <div class="pw-form" style="margin-bottom:12px">
        <div class="pw-field">
          <label data-i18n="settings.password.current"></label>
          <input type="password" id="pw-current" class="k9-input" />
        </div>
        <div class="pw-field">
          <label data-i18n="settings.password.new"></label>
          <input type="password" id="pw-new" class="k9-input" />
        </div>
        <div class="pw-field">
          <label data-i18n="settings.password.confirm"></label>
          <input type="password" id="pw-confirm" class="k9-input" />
        </div>
      </div>
      <div class="btn-row" style="justify-content:flex-start; margin-bottom:16px">
        <button class="k9-btn green" onclick="savePassword()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span data-i18n="settings.password.save"></span>
        </button>
        <button class="k9-btn" onclick="removePassword()" data-i18n="settings.password.remove"></button>
      </div>

      <div style="margin-bottom:16px; max-width:400px">
        <div class="dash-section-title" style="margin-bottom:8px" data-i18n="settings.language.title"></div>
        <div style="display:flex; align-items:center; gap:10px; font-size:11px; font-weight:600">
          <label data-i18n="settings.language.label"></label>
          <select id="setting-language" class="k9-select" onchange="changeLanguage(this.value)">
            <option value="he" data-i18n="settings.language.he"></option>
            <option value="en" data-i18n="settings.language.en"></option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:16px; max-width:400px">
        <div class="dash-section-title" style="margin-bottom:8px" data-i18n="settings.delay.title"></div>
        <div style="display:flex; align-items:center; gap:10px; font-size:11px; font-weight:600">
          <label data-i18n="settings.delay.label"></label>
          <select id="setting-delay" class="k9-select" onchange="saveAdvancedSettings()">
            <option value="0" data-i18n="settings.delay.off"></option>
            <option value="1" data-i18n="settings.delay.1h"></option>
            <option value="24" data-i18n="settings.delay.24h"></option>
            <option value="48" data-i18n="settings.delay.48h"></option>
          </select>
        </div>
      </div>

      <div style="max-width:440px">
        <div class="dash-section-title" style="margin-bottom:8px; color:var(--red); border-color:var(--red)" data-i18n="settings.danger.title"></div>
        <div style="font-size:11px; color:#666; margin-bottom:6px" data-i18n="settings.danger.desc"></div>
        <button class="k9-btn red" onclick="showUninstall()" data-i18n="settings.danger.button"></button>
      </div>

    </div><!-- /page-password -->

    <!-- ── HELP ──────────────────────────────────────────────────────────────── -->
    <div id="page-help" style="display:none">

      <div class="content-title">
        <span class="ct-icon"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor" stroke="none"/></svg></span>
        <span data-i18n="settings.help.title"></span>
      </div>

      <div style="font-size:11px; line-height:1.6; color:#333; max-width:460px">
        <p style="margin-bottom:8px" data-i18n="settings.help.intro"></p>
        <table class="k9-tbl">
          <tbody>
            <tr><td class="lbl" data-i18n="settings.help.user-guide"></td><td><a href="#" style="color:var(--navy-mid)" data-i18n="settings.help.download-pdf"></a></td></tr>
            <tr><td class="lbl" data-i18n="settings.help.kb"></td><td><a href="#" style="color:var(--navy-mid)" data-i18n="settings.help.browse"></a></td></tr>
            <tr><td class="lbl" data-i18n="settings.help.email"></td><td class="ltr-text">support@k10webprotection.com</td></tr>
            <tr><td class="lbl" data-i18n="settings.help.version"></td><td class="ltr-text">K10 Web Protection v4.1.0</td></tr>
          </tbody>
        </table>
      </div>

    </div><!-- /page-help -->

  </main><!-- /k9-content -->

</div><!-- /k9-body -->

<!-- ── FOOTER ──────────────────────────────────────────────────────────────── -->
<div class="k9-footer-bar">
  <div class="brand-logo">
    <span class="brand-k"> K10</span>
    <span class="brand-star">★</span>
    <span class="brand-sub" data-i18n="common.footer.brand-sub"></span>
  </div>
</div>
<div class="k9-footer-copy" data-i18n="common.footer.copyright"></div>

<!-- Notification bar -->
<div class="notifyBar" id="notifyBar"></div>

<!-- Generic password confirmation modal -->
<div id="pwConfirmBg" class="modal-bg">
  <div class="modal-box">
    <div class="modal-title" id="pwConfirmTitle" data-i18n="modal.pw.title"></div>
    <div class="modal-body">
      <div style="margin-bottom:4px;font-weight:600" data-i18n="modal.pw.label"></div>
      <input type="password" id="pwConfirmInput" class="k9-input" style="width:220px" data-i18n-placeholder="modal.pw.placeholder" />
      <div id="pwConfirmErr" style="color:#cc2222;font-size:12px;margin-top:6px;display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="k9-btn" onclick="closePwConfirm()" data-i18n="common.cancel"></button>
      <button class="k9-btn green" id="pwConfirmOkBtn" data-i18n="common.confirm"></button>
    </div>
  </div>
</div>

<!-- Quit modal -->
<div id="quitModalBg" class="modal-bg">
  <div class="modal-box">
    <div class="modal-title" data-i18n="modal.quit.title"></div>
    <div class="modal-body">
      <p data-i18n="modal.quit.body"></p>
      <div id="quit-pw-row" style="display:none; margin-top:10px">
        <div style="margin-bottom:4px; font-weight:600" data-i18n="modal.pw.label"></div>
        <input type="password" id="quit-pw" class="k9-input" style="width:220px" data-i18n-placeholder="modal.pw.placeholder" />
      </div>
      <div id="quit-err" style="color:#cc2222; font-size:12px; margin-top:6px; display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="k9-btn" onclick="closeQuitModal()" data-i18n="common.cancel"></button>
      <button class="k9-btn red" onclick="confirmQuit()" data-i18n="modal.quit.confirm"></button>
    </div>
  </div>
</div>

<!-- Disable protection modal -->
<div id="modalBg" class="modal-bg">
  <div class="modal-box">
    <div class="modal-title" data-i18n="modal.disable.title"></div>
    <div class="modal-body">
      <p data-i18n="modal.disable.body"></p>
      <div id="modal-pw-row" style="display:none; margin-top:10px">
        <div style="margin-bottom:4px; font-weight:600" data-i18n="modal.pw.label"></div>
        <input type="password" id="disable-pw" class="k9-input" style="width:220px" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="k9-btn" onclick="closeModal()" data-i18n="common.cancel"></button>
      <button class="k9-btn red" onclick="confirmDisable()" data-i18n="modal.disable.confirm"></button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
